name: Upstream sync

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  workflow_dispatch:        # "Run workflow" button on Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Bump upstream submodule
        id: bump
        run: |
          cd upstream
          OLD=$(git rev-parse HEAD)
          git fetch --depth=1 origin master
          git checkout origin/master
          NEW=$(git rev-parse HEAD)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "short_new=${NEW:0:12}" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if no change
        if: steps.bump.outputs.changed == 'false'
        run: |
          echo "Upstream unchanged at ${{ steps.bump.outputs.old }}. Nothing to do."
          exit 0

      - name: Verify overlay anchors still present
        id: anchors
        continue-on-error: true
        run: bash scripts/check-anchors.sh

      - name: Build package
        run: bash scripts/build.sh

      - name: Optional QML lint
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qt6-declarative-dev-tools 2>/dev/null || true
          if command -v qmllint6 &>/dev/null; then
            qmllint6 build/package/*.qml || true
          else
            echo "qmllint6 not available, skipping."
          fi

      - name: Check safe-to-merge
        id: safety
        run: |
          TARGETS="applets/digital-clock/DigitalClock.qml
          applets/digital-clock/configAppearance.qml
          applets/digital-clock/main.xml
          applets/digital-clock/metadata.json"
          # git diff <sha> <sha> compares trees directly — no ancestry needed, works with shallow clones
          TOUCHED=$(git -C upstream diff --name-only \
            "${{ steps.bump.outputs.old }}" "${{ steps.bump.outputs.new }}" \
            -- applets/digital-clock/DigitalClock.qml \
               applets/digital-clock/configAppearance.qml \
               applets/digital-clock/main.xml \
               applets/digital-clock/metadata.json \
            2>/dev/null || echo "diff-failed")
          echo "touched<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TOUCHED"     >> "$GITHUB_OUTPUT"
          echo "EOF"          >> "$GITHUB_OUTPUT"
          if [ -z "$TOUCHED" ] && [ "${{ steps.anchors.outcome }}" = "success" ]; then
            echo "safe=true"  >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: upstream-sync/${{ steps.bump.outputs.new }}
          title: "chore: upstream sync ${{ steps.bump.outputs.short_new }}"
          commit-message: "chore: bump upstream plasma-workspace to ${{ steps.bump.outputs.new }}"
          body: |
            Automated bump of `upstream/` submodule.

            | | SHA |
            |---|---|
            | **Old** | `${{ steps.bump.outputs.old }}` |
            | **New** | `${{ steps.bump.outputs.new }}` |

            **Overlay anchor check:** `${{ steps.anchors.outcome }}`
            **Overlay-target files touched:** `${{ steps.safety.outputs.touched != '' && steps.safety.outputs.touched || 'none' }}`
            **Auto-merge:** ${{ steps.safety.outputs.safe == 'true' && 'enabled — will self-merge once CI passes' || 'blocked — needs manual review' }}

            - `success` anchors + no overlay-target changes = auto-merge
            - Any anchor failure or change to our 4 patched files = manual review required

            [View diff on KDE Invent](https://invent.kde.org/plasma/plasma-workspace/-/compare/${{ steps.bump.outputs.old }}...${{ steps.bump.outputs.new }})
          labels: ${{ steps.safety.outputs.safe == 'true' && 'upstream-sync,auto-merge' || 'upstream-sync,needs-review' }}

      - name: Auto-merge if safe
        if: steps.safety.outputs.safe == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} \
            --merge --delete-branch --auto
