name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check overlay anchors
        run: bash scripts/check-anchors.sh

      - name: Build package
        run: bash scripts/build.sh

      - name: Verify required files exist
        run: |
          test -f build/package/metadata.json
          test -f build/package/contents/ui/main.qml
          test -f build/package/contents/ui/DigitalClock.qml
          test -f build/package/contents/ui/CalendarView.qml
          test -f build/package/contents/config/main.xml
          echo "All required files present."
